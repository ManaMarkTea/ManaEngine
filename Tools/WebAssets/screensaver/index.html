<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050a0e">
  <meta name="description" content="A quiet wall of working terminals, scrolling real code from ManaRenderer.">
  <title>Code Screensaver · ManaRenderer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050a0e; color: #b9cbd1; font: 12px ui-monospace, Consolas, monospace; }
    canvas { display: block; position: absolute; top: 40px; width: 100%; height: calc(100% - 40px); }
    nav { position: fixed; top: 0; left: 0; width: 100%; height: 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; border-bottom: 1px solid #3d6552; background: #0b151e; white-space: nowrap; }
    .playback, .info { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .info { justify-content: flex-end; color: #80dfa0; }
    .title { color: #80dfa0; margin-right: 12px; }
    .full-icon { display: none; }
    button, a { font: inherit; color: #b9cbd1; background: transparent; border: 0; border-radius: 4px; padding: 9px 12px; cursor: pointer; text-decoration: none; }
    button:hover, a:hover { background: #21363e; color: #80e5a1; }
    #sound { color: #80dfa0; }
    button:disabled { opacity: .4; cursor: default; }
    :focus-visible { outline: 2px solid #80e5a1; outline-offset: 2px; }
    #status { position: fixed; top: 50%; width: 100%; text-align: center; color: #80e5a1; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    @media (max-width: 1000px) { .title { display: none; } }
    @media (max-width: 600px) { #run-status { display: none; } .full-label { display: none; } .full-icon { display: inline; } button, a { padding: 9px 6px; } nav { padding: 0 4px; } .playback { gap: 0; } }
  </style>
</head>
<body>
  <h1 class="sr">ManaRenderer Code Screensaver</h1>
  <canvas aria-label="Animated terminal windows scrolling real ManaRenderer source code"></canvas>
  <p id="status" role="status">Opening sessions…</p>
  <nav aria-label="Screensaver controls">
    <div class="playback">
      <span class="title">CODE SCREENSAVER</span>
      <button id="pause" aria-pressed="false" title="Pause or resume (P)">Pause</button>
      <button id="stop" title="Stop or start a fresh set of sessions (S)">Stop</button>
      <button id="sound" aria-pressed="false" title="Toggle soft typing sounds (M)">Sound off</button>
    </div>
    <button id="fullscreen" aria-label="Toggle full screen" title="Toggle full screen (F)"><span class="full-label">Full screen</span><span class="full-icon" aria-hidden="true">⛶</span></button>
    <div class="info"><span id="run-status" role="status">Loading</span><a href="https://github.com/ManaMarkTea/ManaRenderer" target="_blank" rel="noopener noreferrer" title="View the source repository">Source ↗</a></div>
  </nav>
  <script type="module" src="screensaver.js"></script>
</body>
</html>
