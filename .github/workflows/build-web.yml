name: Build web editor and play, deploy to GitHub Pages

# Publish the directory directly: immutable assets remain separate files and Butler uploads deltas.
on:
  push:
    branches: [master]
    # Notes, docs and photos can't change either app; a push of only those doesn't rebuild.
    paths-ignore:
      - "**/*.md"
      - "DevPhotos/**"
      - ".gitignore"
  workflow_dispatch:

# One deploy at a time, the newest winning: two pushes close together otherwise race to Pages.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # The two AOT publishes are most of the run, so they build side by side rather than one after the other.
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: editor
            project: ManaVoxel.Editor.Web
          - app: play
            project: ManaVoxel.Web
    runs-on: ubuntu-latest
    # RunAOTCompilation + the emscripten native build are slow; give real headroom without letting a
    # stuck build hang for the default 6 hours.
    timeout-minutes: 60
    env:
      APP_BUNDLE: Artifacts/Bin/${{ matrix.project }}/Release/net10.0/browser-wasm/AppBundle

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Capture .NET SDK version
        id: dotnet-sdk
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache wasm-tools workload packs
        uses: actions/cache@v6
        with:
          path: |
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
            ~/.dotnet/metadata/workloads
          key: ${{ runner.os }}-wasm-tools-${{ steps.dotnet-sdk.outputs.version }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Publish ${{ matrix.app }}
        # The browser-wasm publish graph builds some referenced projects more than once; keep them
        # serialized so GenerateDepsFile does not race on the shared output (e.g. ManaCore.deps.json).
        run: dotnet publish ${{ matrix.project }}/${{ matrix.project }}.csproj -c Release -m:1

      - name: Move the external asset library off to the shared GitHub Pages folder
        # itch.io caps a browser build's extracted size at 500MB and the asset library alone is past
        # that, so it is served from GitHub Pages and the app's catalog points there. Both apps split
        # into the same folder once merged: files are content-hashed, so a shared name is identical bytes.
        run: |
          python Tools/WebAssets/split_for_itch.py \
            --app-bundle "$APP_BUNDLE" \
            --library-out stage/web-assets/AssetLibrary \
            --external-base-url https://manamarktea.github.io/ManaRenderer/web-assets/AssetLibrary/
          mkdir -p stage/apps
          mv "$APP_BUNDLE" "stage/apps/${{ matrix.app }}"

      - name: Upload ${{ matrix.app }} build
        uses: actions/upload-artifact@v7
        with:
          name: stage-${{ matrix.app }}
          path: stage
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: Tools/WebAssets

      - name: Download both builds
        uses: actions/download-artifact@v8
        with:
          pattern: stage-*
          path: stage
          merge-multiple: true

      - name: Assemble GitHub Pages site
        # Each app's build goes in <app>/v/<build>/, named by <app>/version.json, which index.html reads
        # uncached. Pages caches every file for 10 minutes and the file names carry no hash, so a deploy
        # over the same paths let a browser pair new boot files with old cached ones -- integrity
        # failures, reported as "Failed to fetch". A versioned folder's files never change, so any cached
        # copy is right. The landing page at the site root is the selector between the apps.
        run: |
          build="${GITHUB_SHA::12}"
          mkdir -p pages-site
          mv stage/web-assets pages-site/web-assets
          for app in editor play; do
            mkdir -p "pages-site/$app/v/$build"
            cp -r "stage/apps/$app/." "pages-site/$app/v/$build/"
            cp "pages-site/$app/v/$build/index.html" "pages-site/$app/index.html"
            echo "{\"build\":\"$build\"}" > "pages-site/$app/version.json"
          done
          cp Tools/WebAssets/pages-index.html pages-site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload web editor to itch.io
        if: github.repository == 'ManaMarkTea/ManaRenderer'
        # Pin the action source to the reviewed v0.0.3 commit; this step receives the Butler secret.
        uses: KikimoraGames/itch-publish@ea06fdc7e36b34a6c4f88b379a73f3362537b998 # v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: stage/apps/editor
          itchUsername: manamarktea
          itchGameId: mana-editor
          buildChannel: web
