name: Build web editor and play, deploy to GitHub Pages

# Publish the directory directly: immutable assets remain separate files and Butler uploads deltas.
on:
  push:
    branches: [master]

# One deploy at a time, the newest winning: two pushes close together otherwise race to Pages.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # RunAOTCompilation + the emscripten native build in ManaVoxel.Editor.Web.csproj/ManaVoxel.Web.csproj
    # are both slow, and this job now publishes both; give it real headroom rather than hitting the
    # default 6-hour cap's opposite problem of no cap at all silently hanging a stuck build.
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Capture .NET SDK version
        id: dotnet-sdk
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache wasm-tools workload packs
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
            ~/.dotnet/metadata/workloads
          key: ${{ runner.os }}-wasm-tools-${{ steps.dotnet-sdk.outputs.version }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Publish web editor
        # ManaVoxel.Editor.Web's browser-wasm publish graph currently builds some referenced
        # projects more than once; keep them serialized so GenerateDepsFile does not race on the
        # shared browser-wasm output path (for example ManaCore.deps.json).
        run: dotnet publish ManaVoxel.Editor.Web/ManaVoxel.Editor.Web.csproj -c Release -m:1

      - name: Pre-build asset preview images
        # Runs before split_for_itch.py: it needs the real model bytes still sitting in
        # AppBundle/AssetLibrary, and whatever it adds there rides along with everything else once
        # that step moves the library out to GitHub Pages.
        run: >
          dotnet run --project Tools/ThumbnailBaker --
          --app-bundle Artifacts/Bin/ManaVoxel.Editor.Web/Release/net10.0/browser-wasm/AppBundle

      - name: Publish web play
        run: dotnet publish ManaVoxel.Web/ManaVoxel.Web.csproj -c Release -m:1

      - name: Move both apps' external asset libraries off to a shared GitHub Pages folder
        # itch.io caps a browser-embedded build's *extracted* size at 500MB; the external asset
        # library alone is already well past that. It moves to GitHub Pages instead, and each
        # app's own copy of the catalog is repointed at the same absolute URL there --
        # ManaAssetCatalog and asset-downloads.js both already handle an absolute blob URL
        # unchanged, so nothing else about either build needs to know which host it ends up
        # shipped to. Both apps split into the same --library-out: files are content-hashed, so a
        # name shared between the editor and play catalogs collides harmlessly (identical bytes).
        run: |
          python Tools/WebAssets/split_for_itch.py \
            --app-bundle Artifacts/Bin/ManaVoxel.Editor.Web/Release/net10.0/browser-wasm/AppBundle \
            --library-out pages-site/web-assets/AssetLibrary \
            --external-base-url https://manamarktea.github.io/ManaRenderer/web-assets/AssetLibrary/
          python Tools/WebAssets/split_for_itch.py \
            --app-bundle Artifacts/Bin/ManaVoxel.Web/Release/net10.0/browser-wasm/AppBundle \
            --library-out pages-site/web-assets/AssetLibrary \
            --external-base-url https://manamarktea.github.io/ManaRenderer/web-assets/AssetLibrary/

      - name: Assemble GitHub Pages site
        # Each app's build goes in <app>/v/<build>/, named by <app>/version.json, which index.html reads
        # uncached. Pages caches every file for 10 minutes and the file names carry no hash, so a deploy
        # over the same paths let a browser pair new boot files with old cached ones -- integrity
        # failures, reported as "Failed to fetch". A versioned folder's files never change, so any cached
        # copy is right. The landing page at the site root is the selector between the apps.
        run: |
          build="${GITHUB_SHA::12}"
          for pair in "editor:ManaVoxel.Editor.Web" "play:ManaVoxel.Web"; do
            app="${pair%%:*}"; project="${pair##*:}"
            mkdir -p "pages-site/$app/v/$build"
            cp -r "Artifacts/Bin/$project/Release/net10.0/browser-wasm/AppBundle/." "pages-site/$app/v/$build/"
            cp "pages-site/$app/v/$build/index.html" "pages-site/$app/index.html"
            echo "{\"build\":\"$build\"}" > "pages-site/$app/version.json"
          done
          cp Tools/WebAssets/pages-index.html pages-site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload web editor to itch.io
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: Artifacts/Bin/ManaVoxel.Editor.Web/Release/net10.0/browser-wasm/AppBundle
          itchUsername: manamarktea
          itchGameId: mana-editor
          buildChannel: web
