name: Build web editor and play, deploy to GitHub Pages

# Publish the directory directly: immutable assets remain separate files and Butler uploads deltas.
on:
  # 14:00 UTC is 07:00 PDT (06:00 in PST winter; cron is UTC only).
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      pages_only:
        description: "Deploy GitHub Pages without uploading the editor to itch.io"
        type: boolean
        default: false

# One deploy at a time; a manual run can supersede the daily deployment.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - name: Checkout history for change detection
        if: github.event_name == 'schedule'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changes since the last successful deployment
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Successful no-change checks also complete the workflow; find an actual publish job.
          gh api --method GET "repos/$GH_REPO/actions/workflows/build-web.yml/runs" \
            -f branch="$DEFAULT_BRANCH" -f status=success -f per_page=100 \
            --jq '.workflow_runs[] | [.id, .head_sha] | @tsv' > "$RUNNER_TEMP/web-runs"
          previous=""
          while read -r run_id sha; do
            published=$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs" \
              --jq '[.jobs[] | select(.name == "publish" and .conclusion == "success")] | length')
            if [[ "$published" != "0" ]]; then
              previous="$sha"
              break
            fi
          done < "$RUNNER_TEMP/web-runs"

          deploy=true
          if [[ -n "$previous" ]] && git cat-file -e "$previous^{commit}" 2>/dev/null; then
            # Keep the original docs/photo exclusions; compare the whole range, not just today's commits.
            if git diff --quiet "$previous" "$GITHUB_SHA" -- . \
              ':(exclude,glob)**/*.md' ':(exclude)DevPhotos/**' ':(exclude).gitignore'; then
              deploy=false
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Daily web deployment needed: $deploy (previous: ${previous:-none})" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # RunAOTCompilation + the emscripten native build are slow; give real headroom without letting a
    # stuck build hang for the default 6 hours.
    timeout-minutes: 80
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APP_BUNDLE: Artifacts/Bin/ManaVoxel.Web/Release/net10.0/browser-wasm/AppBundle

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Capture .NET SDK version
        id: dotnet-sdk
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache wasm-tools workload packs
        uses: actions/cache@v6
        with:
          path: |
            ~/.dotnet/packs
            ~/.dotnet/sdk-manifests
            ~/.dotnet/metadata/workloads
          key: ${{ runner.os }}-wasm-tools-${{ steps.dotnet-sdk.outputs.version }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Publish editor and play
        # Serialize referenced-project builds to avoid shared output races.
        run: dotnet publish ManaVoxel.Web/ManaVoxel.Web.csproj -c Release -m:1

      - name: Separate the external asset library
        # itch.io's extracted-size limit is 500MB; the catalog points to the library on Pages.
        run: |
          python Tools/WebAssets/split_for_itch.py \
            --app-bundle "$APP_BUNDLE" \
            --library-out pages-site/web-assets/AssetLibrary \
            --external-base-url https://manamarktea.github.io/ManaRenderer/web-assets/AssetLibrary/

      - name: Assemble GitHub Pages site
        run: python Tools/WebAssets/assemble_pages.py --app-bundle "$APP_BUNDLE" --output pages-site --build "${GITHUB_SHA::12}" --itch-editor

      # Build and deploy share a runner: no staging artifacts or second copy of the WASM bundle.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload web editor to itch.io
        if: github.repository == 'ManaMarkTea/ManaRenderer' && inputs.pages_only != true
        # Pages is already live; an itch.io API timeout shouldn't fail the run (the next push re-uploads).
        continue-on-error: true
        # Pin the action source to the reviewed v0.0.3 commit; this step receives the Butler secret.
        uses: KikimoraGames/itch-publish@ea06fdc7e36b34a6c4f88b379a73f3362537b998 # v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: ${{ env.APP_BUNDLE }}
          itchUsername: manamarktea
          itchGameId: mana-editor
          buildChannel: web

      - name: Delete the deployed Pages artifact
        # The deployed site is independent of this upload; failed deployments retain it for one day.
        if: always() && steps.deployment.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' > "$RUNNER_TEMP/pages-artifact-ids"
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done < "$RUNNER_TEMP/pages-artifact-ids"
