<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ManaVoxel Editor — Web</title>
  <style>
    /* Colours, metrics and timings below are lifted from ManaUI's dark UiTheme and from
       ManaLoadingScreenManaView/ProgressBar, so the browser build's loading screen and the
       engine's own are the same picture. If the theme moves, move these with it. */
    :root {
      --mana-background: #1E1F22;  /* UiTheme.Background  */
      --mana-surface:    #2B2D30;  /* UiTheme.Surface     */
      --mana-surface-alt:#1E1F22;  /* UiTheme.SurfaceAlt  */
      --mana-border:     #3B3E43;  /* UiTheme.Border      */
      --mana-text-muted: #9DA0A8;  /* UiTheme.TextMuted   */
      --mana-accent:     #4A88E8;  /* UiTheme.Accent      */
      --mana-error:      #E05252;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--mana-background);
      color: #DFE1E5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #manaCanvas { display: block; width: 100%; height: 100%; }

    /* pointer-events: none throughout -- nothing here is interactive, and it means an overlay
       that somehow fails to hide can never brick canvas input behind it. */
    #manaLoading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--mana-background);
      pointer-events: none;
      opacity: 1;
      transition: opacity 320ms ease-out;
    }

    #manaLoading.mana-hidden { opacity: 0; }

    .mana-card {
      box-sizing: border-box;
      width: 460px;             /* ManaLoadingScreenManaView.CardWidth  */
      min-height: 168px;        /* ManaLoadingScreenManaView.CardHeight */
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      background: var(--mana-surface);
      border: 1px solid var(--mana-border);
      border-radius: 8px;       /* UiTheme.CornerRadiusLarge */
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .mana-title {
      margin: 0;
      text-align: center;
      font-size: 18px;          /* UiTheme.FontSizeHeading */
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--mana-accent);
      /* The engine screen pulses its heading so a step that happens to take a while cannot be
         mistaken for a hang. It matters far more here: both the wasm download and the level load
         block the main thread outright, so a JS-driven animation would freeze solid at exactly
         the moment it needs to be moving. opacity and transform animate on the compositor, which
         keeps running regardless of what the main thread is doing -- so every moving part on this
         screen is restricted to those two properties on purpose. 2.09s is the engine's own
         sin(time * 3.0) period. */
      animation: mana-pulse 2.09s ease-in-out infinite;
    }

    @keyframes mana-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.6; }
    }

    .mana-status,
    .mana-percent {
      margin: 0;
      text-align: center;
      font-size: 13px;          /* UiTheme.FontSizeSmall */
      color: var(--mana-text-muted);
    }

    .mana-percent { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* The emoji the browser has drawn for the UI so far, each popping in as it is made. */
    .mana-emoji {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 2px;
      min-height: 0; max-width: 100%; margin: 0;
      font-size: 20px; line-height: 1.2;
    }
    .mana-emoji span { animation: mana-emoji-pop 360ms cubic-bezier(.3, 1.6, .5, 1) both; }
    @keyframes mana-emoji-pop {
      from { transform: scale(0) rotate(-30deg); opacity: 0; }
      to   { transform: scale(1) rotate(0); opacity: 1; }
    }

    .mana-track {
      position: relative;
      height: 8px;              /* ProgressBar.Thickness */
      border-radius: 4px;
      background: var(--mana-surface-alt);
      overflow: hidden;
    }

    /* scaleX rather than width: width is a layout property and only ever updates on the main
       thread, which is blocked for most of this screen's life. The track clips the corners, so
       scaling a plain rect still reads as a rounded bar. */
    .mana-fill {
      position: absolute;
      inset: 0;
      background: var(--mana-accent);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 220ms ease-out;
    }

    /* ProgressBar's indeterminate sweep, at its own SweepSeconds. Runs the whole time, not only
       when the fraction is unknown: it is the one part of the screen that proves the page is
       still alive while wasm has the main thread. */
    .mana-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.16) 50%,
        rgba(255, 255, 255, 0) 100%);
      transform: translateX(-100%);
      animation: mana-sweep 1.4s linear infinite;
    }

    @keyframes mana-sweep {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }

    /* A failed boot used to be a black page and a console nobody had open. */
    #manaLoading.mana-failed .mana-title { animation: none; color: var(--mana-error); }
    #manaLoading.mana-failed .mana-sweep { animation: none; opacity: 0; }
    #manaLoading.mana-failed .mana-fill  { background: var(--mana-error); }

    #manaLoading.mana-failed .mana-status {
      color: var(--mana-error);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 40vh;
      overflow-y: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      .mana-title, .mana-sweep { animation: none; }
      .mana-fill { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="manaCanvas"></canvas>

  <div id="manaLoading">
    <div class="mana-card">
      <h1 class="mana-title">MANA EDITOR</h1>
      <p class="mana-status" id="manaLoadingStatus">Starting...</p>
      <div class="mana-track">
        <div class="mana-fill" id="manaLoadingFill"></div>
        <div class="mana-sweep"></div>
      </div>
      <p class="mana-percent" id="manaLoadingPercent">0%</p>
      <p class="mana-emoji" id="manaLoadingEmoji" aria-hidden="true"></p>
    </div>
  </div>

  <script>
    // Deliberately an inline classic script, not part of main.js: main.js is a module, so it does
    // not run until the whole document has parsed AND `import { dotnet }` has fetched, and the
    // whole point of this overlay is to be driving before any of that. Everything it needs is in
    // the markup above it.
    //
    // The API is global because three separate JS worlds drive it and none of them can import
    // from the others: this script, main.js (a module), and mana_interop.js (pulled in by
    // JSHost.ImportAsync, which is how C# reports engine-side progress). Same reasoning as
    // globalThis.ManaExports in main.js.
    (function () {
        // The download is the long pole -- roughly 45 MB of _framework plus 13 MB of bundled
        // assets -- so it gets most of the bar, and the engine's own load the rest. Two phases
        // on one bar rather than two bars, because from outside they are one wait.
        var DOWNLOAD_SHARE = 0.7;

        var root = document.getElementById('manaLoading');
        var statusEl = document.getElementById('manaLoadingStatus');
        var fillEl = document.getElementById('manaLoadingFill');
        var percentEl = document.getElementById('manaLoadingPercent');

        // Monotonic: the download total is discovered as Content-Length headers arrive, so the
        // denominator grows during the first second or so. Clamping forward means the bar stalls
        // briefly instead of visibly running backwards, which reads as something going wrong.
        var shown = 0;
        var failed = false;
        var hidden = false;

        function megabytes(bytes) {
            return (bytes / (1024 * 1024)).toFixed(1);
        }

        function apply(fraction, status) {
            if (failed || hidden) {
                return;
            }
            if (typeof fraction === 'number' && isFinite(fraction)) {
                shown = Math.max(shown, Math.min(1, Math.max(0, fraction)));
                fillEl.style.transform = 'scaleX(' + shown + ')';
                percentEl.textContent = Math.round(shown * 100) + '%';
            }
            if (status) {
                statusEl.textContent = status;
            }
        }

        globalThis.ManaLoading = {
            /// Bytes off the network, before any C# has run. totalBytes may still be growing.
            download: function (receivedBytes, totalBytes) {
                var fraction = totalBytes > 0 ? (receivedBytes / totalBytes) * DOWNLOAD_SHARE : 0;
                apply(fraction, 'Downloading engine  ' + megabytes(receivedBytes) + ' / ' + megabytes(totalBytes) + ' MB');
            },

            /// C#-side progress, 0..1 across the engine's own load. Called from mana_interop.js.
            engine: function (status, fraction) {
                var scaled = typeof fraction === 'number' && isFinite(fraction)
                    ? DOWNLOAD_SHARE + fraction * (1 - DOWNLOAD_SHARE)
                    : undefined;
                apply(scaled, status);
            },

            /// Terminal: the screen stays up showing why, rather than a blank canvas and a
            /// console nobody opened.
            fail: function (message) {
                if (hidden) {
                    return;
                }
                failed = true;
                root.classList.add('mana-failed');
                root.querySelector('.mana-title').textContent = 'FAILED TO START';
                statusEl.textContent = String(message);
                percentEl.textContent = '';
                console.error('[ManaLoading] ' + message);
            },

            hide: function () {
                if (failed || hidden) {
                    return;
                }
                hidden = true;
                apply(1, 'Ready');
                root.classList.add('mana-hidden');
                // After the opacity transition, not with it: removing the node mid-fade snaps it
                // away. 400ms covers the 320ms transition with room for a slow frame.
                setTimeout(function () { root.remove(); }, 400);
            },

            /// Each emoji the browser draws for the UI (mana_interop.js drawEmoji), shown as it is made.
            emoji: function (text) {
                var tray = document.getElementById('manaLoadingEmoji');
                if (hidden || !tray || tray.childElementCount >= 48) {
                    return;
                }
                var item = document.createElement('span');
                item.textContent = text;
                tray.appendChild(item);
            },

            isFailed: function () { return failed; }
        };
    })();
  </script>

  <!-- A deploy puts each build in v/<build>/ and names it in version.json, read uncached: the build's own files
       never change, so the browser may cache them freely without ever pairing one deploy's loader with another's
       files (Pages caches for 10 minutes, and a mix fails its integrity checks as "Failed to fetch"). A local
       build has no version.json and loads from here. -->
  <script type="module">
    try {
        const response = await fetch('version.json', { cache: 'no-store' });
        if (response.ok) {
            const { build } = await response.json();
            const base = document.createElement('base');
            base.href = `v/${build}/`;
            document.head.appendChild(base);
        }
    } catch (error) {
        // No version file: a local build.
    }
    await import(new URL('main.js', document.baseURI).href);
  </script>
</body>
</html>
